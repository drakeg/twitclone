name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/ci-runner-diagnostic

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - run: echo "Python job setup valid"
