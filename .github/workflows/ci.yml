name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TWITCLONE_ENV: testing
      SECRET_KEY: ci-test-only-secret
      DATABASE_URL: sqlite:///:memory:
      UPLOAD_FOLDER: /tmp/twitclone-ci-uploads
      SCHEDULER_ENABLED: "false"
      SCHEDULER_INTERVAL_SECONDS: "60"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify dependency imports
        run: python scripts/verify_dependencies.py

      - name: Verify database migrations
        run: python scripts/verify_migrations.py

      - name: Run tests
        run: python -m pytest --strict-markers --maxfail=1

  release-image:
    name: Release image validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build immutable local release image with shared layer cache
        env:
          RIPPLE_BUILD_PLATFORM: linux/amd64
          RIPPLE_IMAGE_REPOSITORY: ripple-ci
          RIPPLE_USE_BUILDX: "true"
        run: bash scripts/build-release-image.sh

      - name: Verify image starts with production entry point available
        run: docker run --rm ripple-ci:${GITHUB_SHA::12} python -c "import application; print('release image import OK')"

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Restore Terraform provider cache
        uses: actions/cache@v6
        with:
          path: .terraform-plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('infra/terraform/versions.tf') }}

      - name: Create Terraform provider cache directory
        working-directory: ${{ github.workspace }}
        run: mkdir -p .terraform-plugin-cache

      - name: Initialize providers without backend
        run: terraform init -backend=false

      - name: Check formatting
        run: terraform fmt -check

      - name: Validate configuration
        run: terraform validate
