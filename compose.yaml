x-app-environment: &app-environment
  SECRET_KEY: local-compose-development-key
  DATABASE_URL: sqlite:////data/twitclone.db
  UPLOAD_FOLDER: /data/uploads
  SCHEDULER_ENABLED: "false"

x-app-service: &app-service
  build: .
  environment: *app-environment
  volumes:
    - twitclone_data:/data

services:
  migrate:
    <<: *app-service
    command: flask --app application db upgrade

  web:
    <<: *app-service
    command: gunicorn --bind 0.0.0.0:8000 --workers 1 --threads 4 --timeout 30 application:application
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    <<: *app-service
    command: python -m twitclone.scheduled_worker
    depends_on:
      migrate:
        condition: service_completed_successfully

  test:
    build: .
    profiles: ["tools"]
    command: python -m pytest --strict-markers --maxfail=1
    environment:
      TWITCLONE_ENV: testing
      SECRET_KEY: compose-test-only-secret
      DATABASE_URL: "sqlite:///:memory:"
      UPLOAD_FOLDER: /tmp/twitclone-test-uploads
      SCHEDULER_ENABLED: "false"
      SCHEDULER_INTERVAL_SECONDS: "60"

volumes:
  twitclone_data:
