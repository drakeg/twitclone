x-app-environment: &app-environment
  TWITCLONE_ENV: ${TWITCLONE_ENV:-development}
  SECRET_KEY: ${SECRET_KEY:-local-compose-development-key}
  DATABASE_URL: ${DATABASE_URL:-sqlite:////data/twitclone.db}
  UPLOAD_FOLDER: ${UPLOAD_FOLDER:-/data/uploads}
  MEDIA_STORAGE_BACKEND: ${MEDIA_STORAGE_BACKEND:-filesystem}
  MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
  MEDIA_S3_REGION: ${MEDIA_S3_REGION:-}
  MEDIA_S3_ENDPOINT_URL: ${MEDIA_S3_ENDPOINT_URL:-}
  MEDIA_S3_PREFIX: ${MEDIA_S3_PREFIX:-media}
  SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
  SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
  PASSWORD_RESET_MAX_AGE_SECONDS: ${PASSWORD_RESET_MAX_AGE_SECONDS:-3600}
  EMAIL_VERIFICATION_MAX_AGE_SECONDS: ${EMAIL_VERIFICATION_MAX_AGE_SECONDS:-86400}
  MAIL_SUPPRESS_SEND: ${MAIL_SUPPRESS_SEND:-true}
  MAIL_SERVER: ${MAIL_SERVER:-localhost}
  MAIL_PORT: ${MAIL_PORT:-1025}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_USE_TLS: ${MAIL_USE_TLS:-false}
  MAIL_USE_SSL: ${MAIL_USE_SSL:-false}
  MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-no-reply@ripple.local}
  MAIL_TIMEOUT_SECONDS: ${MAIL_TIMEOUT_SECONDS:-10}
  STRIPE_BILLING_ENABLED: ${STRIPE_BILLING_ENABLED:-false}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_API_VERSION: ${STRIPE_API_VERSION:-2026-03-25.dahlia}

x-app-service: &app-service
  build: .
  environment: *app-environment
  volumes:
    - twitclone_data:/data

services:
  migrate:
    <<: *app-service
    command: flask --app application db upgrade

  web:
    <<: *app-service
    command: gunicorn --bind 0.0.0.0:8000 --workers 1 --threads 4 --timeout 30 application:application
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${RIPPLE_BIND_HOST:-0.0.0.0}:${RIPPLE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    <<: *app-service
    command: python -m twitclone.scheduled_worker
    depends_on:
      migrate:
        condition: service_completed_successfully

  test:
    build: .
    profiles: ["tools"]
    command: python -m pytest --strict-markers --maxfail=1
    volumes:
      - .:/app:ro
    environment:
      TWITCLONE_ENV: testing
      SECRET_KEY: compose-test-only-secret
      DATABASE_URL: "sqlite:///:memory:"
      UPLOAD_FOLDER: /tmp/twitclone-test-uploads
      SCHEDULER_ENABLED: "false"
      SCHEDULER_INTERVAL_SECONDS: "60"
      PYTEST_ADDOPTS: "-o cache_dir=/tmp/pytest-cache"
      PYTHONDONTWRITEBYTECODE: "1"

volumes:
  twitclone_data:
