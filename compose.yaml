x-app-environment: &app-environment
  SECRET_KEY: local-compose-development-key
  DATABASE_URL: sqlite:////data/twitclone.db
  UPLOAD_FOLDER: /data/uploads
  SCHEDULER_ENABLED: "false"

x-app-service: &app-service
  build: .
  environment: *app-environment
  volumes:
    - twitclone_data:/data

services:
  migrate:
    <<: *app-service
    command: flask --app application db upgrade

  web:
    <<: *app-service
    command: gunicorn --bind 0.0.0.0:8000 --workers 1 --threads 4 --timeout 30 application:application
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  worker:
    <<: *app-service
    command: python -m twitclone.scheduled_worker
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  twitclone_data:
