{% extends "base.html" %}
{% block title %}Reset password · Ripple{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<section class="surface-card auth-card">
    <span class="auth-kicker">Account recovery</span>
    <h1>Choose a new password.</h1>
    <p>Resetting password for <strong>@{{ username }}</strong>.</p>
    <form method="POST">
        <div class="mb-3">
            <label for="password" class="form-label">New password</label>
            <input type="password" class="form-control" id="password" name="password" minlength="8" autocomplete="new-password" required>
        </div>
        <div class="mb-4">
            <label for="password_confirm" class="form-label">Confirm new password</label>
            <input type="password" class="form-control" id="password_confirm" name="password_confirm" minlength="8" autocomplete="new-password" required>
        </div>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-primary w-100">Reset password</button>
    </form>
</section>
{% endblock %}
